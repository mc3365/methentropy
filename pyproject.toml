[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "methentropy"
version = "3.2.0"
description = "Depth-matched null models for 4-CpG methylation entropy from RLM output"
readme = "README.md"
authors = [{ name = "Meiying Cui" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3"]

[project.urls]
Repository = "https://github.com/mc3365/methentropy"

[project.optional-dependencies]
plot = ["matplotlib>=3.5", "scipy>=1.7"]
dev = ["pytest>=7", "matplotlib>=3.5", "scipy>=1.7"]

[project.scripts]
methentropy = "methentropy.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
